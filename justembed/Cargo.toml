[workspace]
resolver = "2"
members = [
    "conversion",
    "systemd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["phdsystems <developer@phdsystems.com>"]
repository = "https://github.com/sweengineeringlabs/machinelearning"

[workspace.dependencies]
# Error handling
thiserror = "2"
anyhow = "1"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async
tokio = { version = "1", features = ["full"] }
# HTTP
axum = { version = "0.8", features = ["json"] }
# CLI
clap = { version = "4", features = ["derive"] }
# Logging
log = "0.4"
env_logger = "0.11"

# Cross-workspace foundations
swe-ml-tensor        = { path = "../main/features/tensor" }
swe-cli              = { path = "../main/features/cli" }

# llmmodel crates (now in sweengineeringlabs/llmodel)
# TODO: publish to crates.io — tracked in https://github.com/sweengineeringlabs/llmodel/issues/4
swe-llmmodel-model           = { git = "https://github.com/sweengineeringlabs/llmodel", rev = "1492f8d" }
swe-llmmodel-arch-nomic-bert = { git = "https://github.com/sweengineeringlabs/llmodel", rev = "1492f8d" }
swe-llmmodel-gguf            = { git = "https://github.com/sweengineeringlabs/llmodel", rev = "1492f8d" }
swe-llmmodel-tokenizer       = { git = "https://github.com/sweengineeringlabs/llmodel", rev = "1492f8d" }
swe-llmmodel-layers          = { git = "https://github.com/sweengineeringlabs/llmodel", rev = "1492f8d" }

# Shared daemon infra (now in sweengineeringlabs/llmodel)
swe-systemd = { git = "https://github.com/sweengineeringlabs/llmodel", rev = "1492f8d" }

# Internal
swe-ml-embedding = { path = "conversion" }
